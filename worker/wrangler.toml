# Minute fee recorder for the ARC deck. Deployed by .github/workflows/deploy-pulse.yml.
name = "kt-pulse"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
SRC_URL = "https://kereslek.github.io/k-telemetry/deck-r7k4x9/data-main.json"

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "PULSE"
class_name = "Pulse"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Pulse"]
