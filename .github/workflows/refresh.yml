name: refresh-data
on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths: ['scripts/**', '.github/workflows/**', 'deck-r7k4x9/config.json']
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch on-chain data
        run: node scripts/fetch-data.mjs
      - name: Commit data.json
        run: |
          git config user.name "lp-hud-bot"
          git config user.email "bot@users.noreply.github.com"
          git add deck-r7k4x9/data*.json deck-r7k4x9/ledger*.json
          if ! git diff --cached --quiet; then
            git pull --rebase origin gh-pages || true
            git commit -m "data refresh $(date -u +%FT%TZ)"
            git push
          fi
