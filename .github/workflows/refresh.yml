name: refresh-data
on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths: ['scripts/**', '.github/workflows/**', 'deck-r7k4x9/config.json']
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # One firing, several refreshes. GitHub throttles scheduled workflows: against a
      # 15-minute cron the observed gaps ran 47, 95, 185 and finally 305 minutes in a single
      # day. A phone that cannot reach an RPC directly then has nothing current to read. Each
      # firing now refreshes four times over roughly fifty minutes, so a sparse schedule still
      # produces reasonably fresh data.
      #
      # A failing pass must not end the loop — a rate-limited RPC on one pass says nothing about
      # the next. The job fails only if every pass failed, which is the case that means the
      # refresh is genuinely broken rather than merely unlucky.
      - name: Refresh, repeatedly
        run: |
          PASSES=4
          SPACING=840          # 14 min between passes; four passes span ~50 min of the hour
          ok=0
          for i in $(seq 1 $PASSES); do
            echo "::group::pass $i/$PASSES"
            if node scripts/fetch-data.mjs && bash scripts/commit-data.sh; then
              ok=$((ok+1)); echo "pass $i ok"
            else
              echo "pass $i failed (continuing)"
            fi
            echo "::endgroup::"
            if [ "$i" -lt "$PASSES" ]; then sleep $SPACING; fi
          done
          echo "$ok of $PASSES passes succeeded"
          if [ "$ok" -eq 0 ]; then echo "every pass failed"; exit 1; fi
