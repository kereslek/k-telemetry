# Once a day: Sui NFT floors as TradePort shows them, and the Ink Sack (Ika tasks) record, for the
# deck's Sui wallets. Writes deck-r7k4x9/sui-daily.json (sealed); the relay folds it into the NFTs
# and their price history. The log is public: counts and yes/no only.
name: sui-daily
on:
  schedule:
    - cron: '7 4 * * *'     # 06:07 Budapest (CEST)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: sui-daily, cancel-in-progress: false }
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: gh-pages }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/sui-daily.mjs
        env: { DECK_PASSPHRASE: '${{ secrets.DECK_PASSPHRASE }}' }
      - name: Commit
        if: always()
        run: |
          [ -f deck-r7k4x9/sui-daily.json ] || exit 0
          git config user.name "lp-hud-bot"; git config user.email "bot@users.noreply.github.com"
          git add deck-r7k4x9/sui-daily.json
          git diff --cached --quiet && exit 0
          git commit -q -m "sui daily $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin gh-pages && git push -q origin HEAD:gh-pages && exit 0; sleep $((i*5)); done; exit 1
