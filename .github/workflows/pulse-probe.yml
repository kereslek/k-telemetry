# One-off check of the minute fee sampler against the live chain. Feature branch only, read-only.
name: pulse-probe
on:
  push:
    branches: [claude/new-session-argqhq]
    paths: ['worker/src/sampler.js', 'scripts/pulse-probe.mjs', '.github/workflows/pulse-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: git show origin/gh-pages:deck-r7k4x9/data-main.json > /tmp/data.json
      - run: node scripts/pulse-probe.mjs
        env:
          SOL_RPC_URL: ${{ secrets.SOL_RPC_URL }}
          N: '12'
