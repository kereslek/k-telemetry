# What can a stranger read? Runs with no secret at all: every published file from the live site must come back
# sealed, and every door of the minute recorder must stay shut without the token. The log is public: answer codes
# and pass/fail only.
name: outside-probe
on:
  push:
    branches: [claude/new-session-argqhq]
    paths: ['scripts/outside-probe.mjs', '.github/workflows/outside-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: gh-pages, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { path: dev }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node dev/scripts/outside-probe.mjs
        env: { HIST: '1' }
