# Does DefiLlama's hourly chart answer from GitHub's runners? Market data only, no secrets.
name: llama-chart-probe
on:
  push:
    branches: [claude/new-session-argqhq]
    paths: ['scripts/llama-chart-probe.mjs', '.github/workflows/llama-chart-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/llama-chart-probe.mjs
