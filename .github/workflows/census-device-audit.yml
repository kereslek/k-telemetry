# WHY YOUR FEES MOVED on real devices: the live deck as an iPhone (Safari's engine), an Android phone
# and a laptop, every part of the panel worked by tap or click. The log is public: yes/no and counts.
name: census-device-audit
on:
  push:
    branches: [claude/new-session-argqhq]
    paths: ['scripts/census-device-audit.mjs', '.github/workflows/census-device-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps webkit chromium
      - run: node scripts/census-device-audit.mjs
        env:
          DECK_PASSPHRASE: ${{ secrets.DECK_PASSPHRASE }}
