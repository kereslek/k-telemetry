# Who uses CPOOL's Ethereum <-> Solana bridge, and what moves them (scripts/bridge-users-probe.mjs). A one-off
# analysis on public data: no passphrase is given to this job; wallets appear only as ranks, pools never by size.
name: bridge-users-probe
on:
  workflow_dispatch:
  push:
    branches: [claude/new-session-argqhq]
    paths: ['scripts/bridge-users-probe.mjs', '.github/workflows/bridge-users-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/bridge-users-probe.mjs
        env:
          SOL_RPC_URL: ${{ secrets.SOL_RPC_URL }}   # optional, faster Solana reads; never printed
