# Every pool of LCX (new contract) on Ethereum and of CPOOL on Solana, from public chain and DEX data:
# trading day by day, size, price agreement, LP books and newcomers, and cross-checks between sources.
# It does not open the deck's data or know which pools are the deck's. The log is public: pool totals
# and counts only.
name: pool-probe
on:
  push:
    branches: [claude/new-session-argqhq]
    paths: ['scripts/pool-probe.mjs', '.github/workflows/pool-probe.yml']
  workflow_dispatch:
    inputs:
      days: { description: 'days of history', required: false, default: '30' }
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save js-sha3@0.9.3
      - run: node scripts/pool-probe.mjs
        env:
          SOL_RPC_URL: ${{ secrets.SOL_RPC_URL }}
          DAYS: ${{ github.event.inputs.days || '30' }}
